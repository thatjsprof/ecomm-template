name: Deploy frontend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to Contabo (Alurd only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/alurd-frontend
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart alurd-web --update-env
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null -w "alurd-web:%{http_code}\n" http://127.0.0.1:3002/; then
                exit 0
              fi
              sleep 1
            done
            echo "alurd-web health check failed"
            pm2 logs alurd-web --lines 40 --nostream || true
            exit 1
